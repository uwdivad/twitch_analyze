services:
  caddy:
    image: caddy:2.8-alpine
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  kafka:
    restart: unless-stopped
    ports: !override []

  clickhouse:
    restart: unless-stopped
    ports: !override []
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}

  backend:
    restart: unless-stopped
    ports: !override []
    volumes: !override []
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    restart: unless-stopped
    ports: !override []
    volumes: !override []

  transcript-worker:
    restart: unless-stopped
    ports: !override []
    volumes: !override []

  audio-capture:
    restart: unless-stopped
    volumes: !override
      - audio-chunks:/tmp/twitch-audio

  kafka-exporter:
    ports: !override []

  kafka-console:
    ports: !override
      - "127.0.0.1:8080:8080"

  prometheus:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:9090:9090"

  grafana:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}

  frontend:
    build:
      context: ./frontend
      target: production
    restart: unless-stopped
    ports: !override []
    volumes: !override []
    command: nginx -g "daemon off;"

volumes:
  caddy-data:
  caddy-config:
  kafka-data:
