global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8000

  - job_name: worker
    static_configs:
      - targets:
          - worker:9101

  - job_name: kafka
    static_configs:
      - targets:
          - kafka-exporter:9308
